<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
  <header>
    <h1>Oconomowoc, WI</h1>
   <label class="switch">
      <input type="checkbox" id="darkModeToggle"/>
      <span class="slider round">Dark Mode</span>
    </label>
  </header>

  <main class="grid">
    
    <div class="card" onclick="showHourly()">
      <h2>Current Weather</h2>
      <div id="currentData">Loading...</div>
    </div>

    <div class="card" onclick="toggleForecastDetails()">
      <h2>7-Day Forecast</h2>
      <div id="forecastData">Loading...</div>
    </div>

    <div class="card" onclick="expandRadar()">
      <h2>Radar</h2>
      <img id="radarImage" src="" alt="Radar Image"/>
    </div>

    <div class="card" onclick="showAlerts()">
      <h2>Severe Weather Alerts</h2>
      <div id="alertsData">Loading...</div>
    </div>

    <div class="card" onclick="showAQDetails()">
      <h2>Air Quality</h2>
      <div id="aqData">Loading...</div>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

   <!-- Weather Alerts section (hidden initially) -->
  <div id="alerts" class="bg-yellow-100 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 p-4 rounded-xl shadow-md my-4 hidden">
    <h2 class="text-xl font-semibold mb-2">⚠️ Weather Alerts</h2>
    <ul id="alert-list" class="space-y-2"></ul>
  </div>

  <!-- Add your scripts here, just before the closing </body> -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Call your other weather functions (current, forecast, radar)
      loadCurrentConditions();
      loadForecast();
      loadRadarImage();

      // Call the function to load weather alerts
      loadWeatherAlerts(); 
    });

    // Define loadWeatherAlerts here or link to an external script file
    async function loadWeatherAlerts() {
      try {
        const res = await fetch("https://nws-alerts-proxy.onrender.com/nws-alerts");
        const data = await res.json();

        const alerts = data.features.filter(alert => {
          const areaDesc = alert.properties.areaDesc || '';
          return areaDesc.includes("Waukesha") || areaDesc.includes("Oconomowoc");
        });

        const alertsContainer = document.getElementById('alerts');
        const alertList = document.getElementById('alert-list');

        if (alerts.length > 0) {
          alertList.innerHTML = ''; // clear any existing alerts
          alerts.forEach(alert => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${alert.properties.event}</strong><br>
              <span class="text-sm">${alert.properties.headline}</span>
            `;
            alertList.appendChild(li);
          });
          alertsContainer.classList.remove('hidden');
        } else {
          alertsContainer.classList.add('hidden');
        }
      } catch (error) {
        console.error('Failed to fetch weather alerts:', error);
      }
    }
  </script>
</body>
</html>
