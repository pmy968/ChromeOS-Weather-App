<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oconomowoc Weather Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Oconomowoc, WI</h1>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle"/>
      <span class="slider round"></span>
    </label>
  </header>

  <main class="grid">
    <div class="card" onclick="showHourly()">
      <h2>Current Weather</h2>
      <div id="currentData">Loading...</div>
    </div>

    <div class="card" onclick="toggleForecastDetails()">
      <h2>7-Day Forecast</h2>
      <div id="forecastData">Loading...</div>
    </div>

    <div class="card" onclick="expandRadar()">
      <h2>Radar</h2>
      <img id="radarImage" src="" alt="Radar Image"/>
    </div>

    <div class="card" onclick="showAlerts()">
      <h2>Severe Weather Alerts</h2>
      <div id="alertsData">Loading...</div>
    </div>

    <div class="card" onclick="showAQDetails()">
      <h2>Air Quality</h2>
      <div id="aqData">Loading...</div>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
