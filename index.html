<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Oconomowoc, WI</h1>
    <button id="dark-mode-toggle">Dark Mode</button>
  </header>

  <main>
    <!-- Current Conditions -->
    <section id="current-conditions" class="card">
      <h2>Current Conditions</h2>
    </section>

    <!-- Forecast -->
    <section id="forecast" class="grid">
      <h2>7-Day Forecast</h2>
    </section>

    <!-- Radar -->
    <section id="radar" class="card">
      <h2>Radar</h2>
      <iframe
        title="Weather Radar"
        width="100%"
        height="500"
        src="https://radar.weather.gov/embed/longloop.php?rid=mkx&product=NCR&overlay=11101111&loop=yes"
        frameborder="0"
        loading="lazy"
      ></iframe>
    </section>

    <!-- Air Quality -->
    <section id="air-quality" class="card">
      <h2>Air Quality</h2>
      <div id="air-quality-data">
        <!-- Air quality info will be injected here -->
      </div>
    </section>

    <!-- Alerts -->
    <section id="alerts" class="card alerts">
      <h2>Severe Weather Alerts</h2>
    </section>
  </main>

  <footer>
    <p>Weather data from the National Weather Service and AirNow</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
